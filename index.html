<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waste2Resource</title>
<style>
:root{--g:#2e7d32;--bg:#fff;--fg:#1f2a24;--card:rgba(255,255,255,.78);--ov:rgba(255,255,255,0)}
body.dark{--bg:#111;--fg:#eef3ee;--card:rgba(25,32,28,.78);--ov:rgba(0,0,0,.6)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.bg{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}.bg.on{opacity:1}
.ov{position:fixed;inset:0;z-index:-1;background:var(--ov)}
header{position:sticky;top:0;z-index:5;background:var(--card);backdrop-filter:blur(10px);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px}
header b{color:var(--g);margin-right:8px}nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
button,select,input,textarea{font:inherit;padding:7px 11px;border-radius:8px;border:1px solid #8a9;background:var(--card);color:var(--fg)}
button{cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px);box-shadow:0 3px 10px #0003}.card{box-shadow:0 4px 18px #0002;border:1px solid #ffffff44}header{box-shadow:0 2px 14px #0003;border-bottom:1px solid #ffffff44}button.p,nav button.act{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:1000px;margin:auto;padding:14px}h1,h2{text-shadow:0 1px 6px rgba(0,0,0,.35);color:#fff}
.card{background:var(--card);backdrop-filter:blur(10px);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pill{padding:2px 9px;border-radius:99px;color:#fff;font-size:.8em}.HIGH{background:#c62828}.MEDIUM{background:#b8860b}.LOW{background:#2e7d32}
.bar{height:10px;background:#8883;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
img.ph{max-width:100%;max-height:200px;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
svg.map{width:100%;height:340px;background:#9db89a55;border-radius:10px}small.est{opacity:.75}
</style></head><body><div class="bg" id="b0"></div><div class="bg" id="b1"></div><div class="ov"></div>
<header><b>♻ Waste2Resource</b><nav id="nav"></nav><button id="dm" aria-label="Toggle dark mode">🌓</button></header>
<main id="m"></main>
<script>
var PAGES=[['home','Home'],['report','Report Waste'],['map','Nearby Hotspots'],['mine','My Reports'],['impact','Impact'],['auth','Authority Dashboard'],['proc','Processing Network']];
var SCN={home:['#ffb token','#2d5a3d'],report:['#9ed0ff','#2f6f5e'],map:['#bfe3ff','#8aa84a'],mine:['#16301f','#0d1f14'],impact:['#ff9f6b','#1b5a7a'],auth:['#a8dcff','#3f8f57'],proc:['#cfe9ff','#5aa04a']};
SCN.home[0]='#ffb870';
var R=[],CFG={lat:16.3067,lng:80.4365,flow:[]},cur='home',bgi=0,mine=JSON.parse(localStorage.getItem('w2rMine')||'[]'),AN=null,F={cat:'',sev:'',st:'',rad:'all'},sel=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function lvl(s){return s>=67?'HIGH':s>=34?'MEDIUM':'LOW'}
function scene(k){var c=SCN[k],t='';
 for(var i=0;i<3;i++)t+='<path d="M0 '+(520+i*60)+' Q300 '+(380+i*50)+' 600 '+(500+i*40)+' T1200 '+(480+i*50)+' V800 H0Z" fill="'+c[1]+'" opacity="'+(.5+i*.25)+'"/>';
 if(k=='map'||k=='impact'||k=='auth')for(var j=0;j<4;j++)t+='<g stroke="#fff" stroke-width="5"><path d="M'+(200+j*250)+' 500V380M'+(200+j*250)+' 380l0-60M'+(200+j*250)+' 380l45 25M'+(200+j*250)+' 380l-45 25"/></g>';
 if(k=='proc')t+='<rect x="700" y="420" width="260" height="90" fill="#555"/><rect x="720" y="380" width="30" height="40" fill="#777"/><rect x="800" y="440" width="120" height="30" fill="#3b6ea5"/>';
 if(k=='mine')for(var l=0;l<14;l++)t+='<ellipse cx="'+(l*90+30)+'" cy="'+(80+(l%4)*150)+'" rx="40" ry="16" fill="#2e7d32" opacity=".35" transform="rotate('+(l*25)+' '+(l*90+30)+' '+(80+(l%4)*150)+')"/>';
 var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs><rect width="1200" height="800" fill="url(#g)"/>'+(k=='home'||k=='impact'?'<circle cx="900" cy="420" r="70" fill="#fff3b0"/>':'')+t+'</svg>';
 return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")'}
function setBg(k){bgi^=1;var e=$('b'+bgi);e.style.backgroundImage=scene(k);e.classList.add('on');$('b'+(bgi^1)).classList.remove('on')}
function api(u,o){return fetch(u,o).then(function(r){return r.json().then(function(j){if(r.status==401){var k=prompt('Authority key:');if(k){sessionStorage.k=k;o=o||{};o.headers=Object.assign({},o.headers,{'X-Authority-Key':k});return fetch(u,o).then(function(r2){return r2.json()})}}if(!r.ok)throw new Error(j.error||'Error');return j})})}
function H(){return sessionStorage.k?{'X-Authority-Key':sessionStorage.k}:{}}
function load(){return api('/api/reports').then(function(d){R=d})}
function go(k){cur=k;setBg(k);var n='';PAGES.forEach(function(p){n+='<button class="'+(p[0]==k?'act':'')+'" onclick="go(\''+p[0]+'\')">'+p[1]+'</button>'});$('nav').innerHTML=n;load().then(function(){draw()})}
function dist(a,b,c,d){var r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 12742*Math.asin(Math.sqrt(h))}
function card(r){return '<div class="card"><b>'+r.report_id+'</b> <span class="pill '+lvl(r.severity_score)+'">'+lvl(r.severity_score)+' '+r.severity_score+'</span> <span class="pill" style="background:#37474f">'+r.status+'</span><br>'+esc(r.category)+' · '+esc(r.address)+'<br><small>'+r.created_at.replace('T',' ')+' · Pathway: '+esc(r.pathway)+'</small><br><small class="est">AI estimation, not a verified measurement</small></div>'}
function draw(){var m=$('m'),h='';
 if(cur=='home')h='<h1>See Waste. Report Waste. Recover Resources. Restore Communities.</h1><div class="card">Detect → Classify → Locate → Report → Assign → Collect → Process → Recover → Measure Impact.<br>Waste → Resource, not simply Waste → Energy.<br><br><button class="p" onclick="go(\'report\')">Report waste</button> <button onclick="go(\'map\')">View hotspots</button></div>'+stats();
 if(cur=='report')h=repForm();
 if(cur=='map')h=mapPg();
 if(cur=='mine'){h='<h2>My Reports</h2>';var mm=R.filter(function(r){return mine.indexOf(r.report_id)>=0});h+=mm.length?mm.map(function(r){return card(r)+track(r)}).join(''):'<div class="card">No reports yet from this device. Submit one!</div>';var v=mm.filter(function(r){return r.status!='REPORTED'}).length;h+='<div class="card">Eco Impact Score: <b>'+v*10+'</b> (points only for verified reports)</div>'}
 if(cur=='impact')h='<h2>Environmental Impact</h2>'+stats()+calc();
 if(cur=='auth')h=authPg();
 if(cur=='proc')h=procPg();
 m.innerHTML=h;if(cur=='map')drawMap();if(cur=='proc')plog()}
var MSG={REPORTED:'✅ Report submitted',VERIFIED:'🔎 Report verified',ASSIGNED:'👷 Team assigned',COLLECTION:'🚛 Collection in progress',PROCESSING:'♻️ Transferred for processing',RESOLVED:'✅ Resolved'};
function track(r){var i=CFG.flow.indexOf(r.status),h='<div class="card"><b>'+MSG[r.status]+'</b></div><div class="card row">';CFG.flow.forEach(function(s,k){h+='<span style="opacity:'+(k<=i?1:.35)+'">'+(k<=i?'✅':'⚪')+' '+s+'</span>'});h+='</div>';
 if(r.after_url)h+='<div class="card grid"><div>BEFORE<br><img class="ph" src="'+r.image_url+'"></div><div>AFTER<br><img class="ph" src="'+r.after_url+'"></div></div>';return h}
function stats(){var t=R.length,res=R.filter(function(r){return r.status=='RESOLVED'}),q=0,rc=0,og=0;res.forEach(function(r){var q1=r.quantity_kg||0;q+=q1;Object.keys(r.composition).forEach(function(k){var kg=q1*r.composition[k]/100;if(k=='Organic')og+=kg;else if(['Plastic','Paper/Cardboard','Glass','Metal','E-waste','Construction'].indexOf(k)>=0)rc+=kg})});
 function b(l,v,p){return '<div class="card">'+l+'<br><b style="font-size:1.4em">'+v+'</b><div class="bar"><i style="width:'+Math.min(100,p)+'%"></i></div></div>'}
 return '<div class="grid">'+b('Total reports',t,100)+b('Active',t-res.length,100*(t-res.length)/(t||1))+b('Resolved',res.length,100*res.length/(t||1))+b('Waste collected (est. kg)',Math.round(q),50)+b('Recyclable recovered (est. kg)',Math.round(rc),q?100*rc/q:0)+b('Organic processed (est. kg)',Math.round(og),q?100*og/q:0)+b('Est. biogas (m³)',(og*.3).toFixed(1),30)+b('Est. CO₂e avoided (kg)',(rc*1.5).toFixed(0),40)+'</div><small class="est" style="color:#fff">Estimated / model-based values</small>'}
function calc(){return '<div class="card"><h3>Waste-to-resource calculator</h3><div class="row">kg <input id="c1" type="number" value="100" style="width:80px"> organic % <input id="c2" type="number" value="50" style="width:70px"> recyclable % <input id="c3" type="number" value="30" style="width:70px"></div><div class="row">m³ biogas/kg <input id="k1" type="number" step=".01" value="0.3" style="width:80px"> kWh/m³ <input id="k2" type="number" step=".1" value="2" style="width:80px"> kg CO₂e/kg <input id="k3" type="number" step=".1" value="1.5" style="width:80px"> <button class="p" onclick="doCalc()">Calculate</button></div><div id="co"></div><small class="est">Estimated / model-based values. Default coefficients are illustrative placeholders; replace with local data.</small></div>'}
function doCalc(){var q=+$('c1').value,o=q*$('c2').value/100,rc=q*$('c3').value/100,bg=o*$('k1').value;$('co').innerHTML='Recoverable material: <b>'+rc.toFixed(1)+' kg</b> · Biogas: <b>'+bg.toFixed(1)+' m³</b> · Energy: <b>'+(bg*$('k2').value).toFixed(1)+' kWh</b> · CO₂e avoided: <b>'+(rc*$('k3').value).toFixed(1)+' kg</b>'}
function repForm(){return '<h2>Report Waste</h2><div class="card"><label>Photo (JPG/PNG/WebP, max 5 MB)<br><input id="ph" type="file" accept="image/*" capture="environment" onchange="analyze()"></label><div id="an"></div><div class="row" style="margin-top:8px"><input id="la" placeholder="Latitude" value="'+CFG.lat+'" style="width:120px"><input id="ln" placeholder="Longitude" value="'+CFG.lng+'" style="width:120px"><button onclick="gps()">📍 Use my location</button></div><input id="ad" placeholder="Address / landmark" style="width:100%;margin:8px 0"><textarea id="de" placeholder="Description (optional)" style="width:100%"></textarea><label><input type="checkbox" id="se"> Near school / hospital / water body</label><br><br><button class="p" onclick="submitRep()">Submit report</button> <span id="rm"></span></div>'}
function gps(){navigator.geolocation?navigator.geolocation.getCurrentPosition(function(p){$('la').value=p.coords.latitude.toFixed(6);$('ln').value=p.coords.longitude.toFixed(6)},function(){alert('Location denied. Enter coordinates manually.')}):alert('Geolocation unavailable')}
function analyze(){var f=$('ph').files[0];if(!f)return;if(f.size>5242880){alert('Max 5 MB');return}var fd=new FormData();fd.append('image',f);$('an').innerHTML='Analyzing…';api('/api/analyze',{method:'POST',body:fd}).then(function(a){AN=a;var h='<div class="card"><b>AI composition</b> (confidence '+a.confidence+', ~'+a.quantity_kg+' kg)<br>';Object.keys(a.composition).forEach(function(k){h+=k+' '+a.composition[k]+'%<div class="bar"><i style="width:'+a.composition[k]+'%"></i></div>'});$('an').innerHTML=h+'Severity '+a.severity_score+' <span class="pill '+lvl(a.severity_score)+'">'+lvl(a.severity_score)+'</span><br><small class="est">'+a.disclaimer+' · source: '+a.source+'</small></div>'}).catch(function(e){AN=null;$('an').innerHTML='❌ '+esc(e.message)})}
function submitRep(){var f=$('ph').files[0];if(!f||!AN){alert('Add a valid photo first');return}var fd=new FormData();fd.append('image',f);fd.append('lat',$('la').value);fd.append('lng',$('ln').value);fd.append('address',$('ad').value);fd.append('desc',$('de').value);fd.append('comp',JSON.stringify(AN.composition));fd.append('qty',AN.quantity_kg);fd.append('sensitive',$('se').checked?'1':'0');
 api('/api/reports',{method:'POST',body:fd}).then(function(r){mine.push(r.report_id);localStorage.setItem('w2rMine',JSON.stringify(mine));AN=null;alert('✅ Report submitted: '+r.report_id);go('mine')}).catch(function(e){$('rm').textContent='❌ '+e.message})}
function filt(){return R.filter(function(r){var d=dist(CFG.lat,CFG.lng,r.latitude,r.longitude);return(!F.cat||r.category==F.cat)&&(!F.sev||lvl(r.severity_score)==F.sev)&&(!F.st||r.status==F.st)&&(F.rad=='all'||d<=+F.rad)&&(!F.q||(r.address+r.report_id).toLowerCase().indexOf(F.q.toLowerCase())>=0)})}
function mapPg(){var o='<option value="">All categories</option>'+Object.keys(PW).map(function(c){return '<option'+(F.cat==c?' selected':'')+'>'+c+'</option>'}).join('');
 return '<h2>Nearby Hotspots</h2><div class="card row"><input placeholder="Search" value="'+esc(F.q||'')+'" oninput="F.q=this.value;drawMap()"><select onchange="F.cat=this.value;drawMap()">'+o+'</select><select onchange="F.sev=this.value;drawMap()"><option value="">Any severity</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><select onchange="F.st=this.value;drawMap()"><option value="">Any status</option>'+CFG.flow.map(function(s){return '<option>'+s+'</option>'}).join('')+'</select><select onchange="F.rad=this.value;drawMap()"><option value="all">All distances</option><option value="1">1 km</option><option value="5">5 km</option><option value="10">10 km</option></select></div><div class="card"><svg class="map" id="svg" viewBox="0 0 600 340"></svg><div id="det">Click a marker for details. 🔴 high 🟡 medium 🟢 resolved 🔵 active/assigned</div></div><div id="hs"></div>'}
var PW={Plastic:1,'Paper/Cardboard':1,Glass:1,Metal:1,Organic:1,'E-waste':1,Hazardous:1,Construction:1,Residual:1};
function drawMap(){var L=filt(),s='<rect width="600" height="340" fill="none"/><path d="M0 250 Q150 200 300 260 T600 230" stroke="#4a90c9" stroke-width="10" fill="none" opacity=".5"/>';
 L.forEach(function(r){var x=300+(r.longitude-CFG.lng)*9000,y=170-(r.latitude-CFG.lat)*9000,c=r.status=='RESOLVED'?'#2e7d32':r.severity_score>=67?'#c62828':['ASSIGNED','COLLECTION','PROCESSING'].indexOf(r.status)>=0?'#1976d2':r.severity_score>=34?'#e0a800':'#e0a800';s+='<circle cx="'+x+'" cy="'+y+'" r="9" fill="'+c+'" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="pick(\''+r.report_id+'\')"/>'});
 $('svg').innerHTML=s;var g={};R.forEach(function(r){var k=r.latitude.toFixed(2)+','+r.longitude.toFixed(2);(g[k]=g[k]||[]).push(r)});var h='<h3 style="color:#fff">Hotspot analytics</h3>';Object.keys(g).filter(function(k){return g[k].length>1}).forEach(function(k){h+='<div class="card">📍 '+k+': '+g[k].length+' reports (repeat dumping zone)</div>'});$('hs').innerHTML=h}
function pick(id){var r=R.filter(function(x){return x.report_id==id})[0];$('det').innerHTML=card(r)+'Distance from map centre: '+dist(CFG.lat,CFG.lng,r.latitude,r.longitude).toFixed(2)+' km'}
function authPg(){var h='<h2>Authority Dashboard</h2><div class="grid"><div class="card">New: <b>'+R.filter(function(r){return r.status=='REPORTED'}).length+'</b></div><div class="card">High priority: <b>'+R.filter(function(r){return r.severity_score>=67&&r.status!='RESOLVED'}).length+'</b></div><div class="card">Pending: <b>'+R.filter(function(r){return r.status!='RESOLVED'}).length+'</b></div><div class="card">Resolved: <b>'+R.filter(function(r){return r.status=='RESOLVED'}).length+'</b></div></div>';
 R.forEach(function(r){var n=CFG.flow[CFG.flow.indexOf(r.status)+1];h+=card(r)+'<div class="card row">'+(r.assigned_authority?'👷 '+esc(r.assigned_authority):'')+(n?'<button class="p" onclick="adv(\''+r.report_id+'\',\''+n+'\')">Advance → '+n+'</button>':'')+(r.status=='PROCESSING'||r.status=='RESOLVED'?'<label>After photo <input type="file" accept="image/*" onchange="afterUp(\''+r.report_id+'\',this)"></label>':'')+'</div>'+(r.after_url?track(r):'')});return h}
function adv(id,to){var t=to=='ASSIGNED'?prompt('Team name','Ward team 1'):null;api('/api/reports/'+id+'/status',{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H()),body:JSON.stringify({to:to,team:t})}).then(function(){go('auth')}).catch(function(e){alert(e.message)})}
function afterUp(id,el){var fd=new FormData();fd.append('image',el.files[0]);api('/api/reports/'+id+'/after',{method:'POST',headers:H(),body:fd}).then(function(){go('auth')}).catch(function(e){alert(e.message)})}
function procPg(){var h='<h2>Processing Network</h2><div class="card">Available streams (estimates):</div>';R.filter(function(r){return r.status=='COLLECTION'||r.status=='PROCESSING'||r.status=='ASSIGNED'}).forEach(function(r){h+=card(r)+'<div class="card">~'+r.quantity_kg+' kg (est.) · '+JSON.stringify(r.composition)+' <button class="p" onclick="acc(\''+r.report_id+'\')">Accept stream</button></div>'});return h+'<div class="card"><h3>Recovery log</h3><div id="pl"></div><small class="est">Estimated / model-based values</small></div>'}
function acc(id){api('/api/reports/'+id+'/accept',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H()),body:'{}'}).then(function(){plog()}).catch(function(e){alert(e.message)})}
function plog(){api('/api/processing').then(function(d){var e=$('pl');if(e)e.innerHTML=d.length?d.map(function(p){return p.report_id+' · '+esc(p.company_id)+' · '+esc(p.processing_method)+' · ♻ '+p.material_recovered+' kg · ⚡ '+p.energy_generated+' kWh (est.)'}).join('<br>'):'No streams accepted yet.'})}
$('dm').onclick=function(){document.body.classList.toggle('dark')};
api('/api/config').then(function(c){CFG=c;go('home')});
</script></body></html>
